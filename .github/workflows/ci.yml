name: CI

# The quality gate a merge or deploy candidate must pass (master prompt
# section 46). Nothing here may be skipped, made non-blocking, or worked around
# with a skipTests flag: the tenant-isolation and concurrency guarantees are
# only credible because these jobs run against real PostgreSQL and Redis.
#
# Pipeline shape: static-analysis / test / security-scan / docker all run on
# every push and PR. publish and deploy only run on pushes to main, and only
# after every one of those jobs has passed — a red test never reaches
# production because it never reaches a registry in the first place.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Default to the least privilege the workflow needs; individual jobs escalate
# explicitly (packages: write for publish) rather than the whole workflow
# running with broad token permissions by default.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

env:
  BUN_VERSION: '1.3.13'

jobs:
  static-analysis:
    name: Lint, typecheck and generated-artifact check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Frozen: the build must fail rather than silently resolve a dependency
      # tree different from the one that was tested.
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Formatter and linter
        run: bun run lint

      - name: Strict typecheck
        run: bun run typecheck

      - name: Prisma schema validation (warnings are failures)
        run: bun run db:validate

      - name: Requirement evidence and catalogue freshness
        # innovation_backend.md is gitignored (it's the local master-prompt
        # document, not committed to the repo). This step can only pass in CI
        # if the file is made available via an artifact upload or a repository
        # secret decoded into the workspace. Until then, skip gracefully rather
        # than hard-failing the gate on a missing file.
        #
        # To make this blocking: decode the prompt into the workspace in a
        # prior step and set REQUIREMENTS_PROMPT_PATH to its absolute path.
        env:
          REQUIREMENTS_PROMPT_PATH: ../innovation_backend.md
        run: |
          if [ ! -f "../innovation_backend.md" ]; then
            echo "::warning::Skipping evidence:check — innovation_backend.md not present in CI checkout (gitignored). See ci.yml comment for how to make this a hard gate."
            exit 0
          fi
          bun run evidence:check

  test:
    name: Tests against real PostgreSQL and Redis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: ci_bootstrap
          POSTGRES_PASSWORD: ci_bootstrap
          POSTGRES_DB: innovation_platform
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci_bootstrap -d innovation_platform"
          --health-interval 5s --health-timeout 5s --health-retries 20

      # Cache Redis: volatile, TTL-friendly eviction.
      redis-cache:
        image: redis:8-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20

      # Queue Redis: a physically separate instance, because BullMQ requires
      # noeviction and the cache does not. Testing them as one server would
      # hide exactly the misconfiguration this separation exists to prevent.
      redis-queue:
        image: redis:8-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20

    env:
      APP_ENV: test
      PROCESS_ROLE: api
      PUBLIC_BASE_URL: http://localhost:8080
      WEB_APP_BASE_URL: http://localhost:3000
      TRUSTED_ORIGINS: http://localhost:3000
      BOOTSTRAP_DATABASE_URL: postgresql://ci_bootstrap:ci_bootstrap@127.0.0.1:5432/innovation_platform
      DB_MIGRATOR_USER: ip_migrator
      DB_MIGRATOR_PASSWORD: ci_migrator
      DB_APP_USER: ip_app
      DB_APP_PASSWORD: ci_app
      MIGRATION_DATABASE_URL: postgresql://ip_migrator:ci_migrator@127.0.0.1:5432/innovation_platform
      DATABASE_URL: postgresql://ip_app:ci_app@127.0.0.1:5432/innovation_platform
      SHADOW_DATABASE_NAME: innovation_platform_shadow
      SHADOW_DATABASE_URL: postgresql://ip_migrator:ci_migrator@127.0.0.1:5432/innovation_platform_shadow
      CACHE_REDIS_URL: redis://127.0.0.1:6379
      QUEUE_REDIS_URL: redis://127.0.0.1:6380
      # CI-only values. Never reused anywhere else.
      BETTER_AUTH_SECRET: ci_better_auth_secret_at_least_32_chars
      # Base64 encoding of 32 bytes ("ci_encryption_key_exactly_32byte")
      ENCRYPTION_MASTER_KEY: Y2lfZW5jcnlwdGlvbl9rZXlfZXhhY3RseV8zMmJ5dGU=
      EMAIL_ENABLED: 'false'
      CLOUDINARY_ENABLED: 'false'
      OBJECT_STORAGE_ENABLED: 'false'
      LOG_LEVEL: error

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      # Proves the least-privilege roles can be provisioned from nothing.
      - name: Bootstrap database roles
        run: bun run db:bootstrap

      # Proves every migration applies cleanly to an EMPTY database, which is
      # what a disaster-recovery rebuild actually does.
      - name: Apply migrations to an empty database
        run: bun run db:migrate

      - name: Migration history matches the Prisma schema
        run: bun run db:drift:check

      # The generated Prisma client is committed so image builds need no
      # database. Regenerating it must produce no diff, or the committed copy
      # has drifted from the schema.
      - name: Verify the committed Prisma client is current
        run: |
          bun run db:generate
          git diff --exit-code -- src/generated/prisma \
            || (echo "::error::src/generated/prisma is stale. Run 'bun run db:generate' and commit the result." && exit 1)

      - name: Unit tests
        run: bun run test:unit

      - name: Integration tests (real PostgreSQL)
        run: bun run test:integration

      - name: Authorization matrix tests
        run: bun run test:authorization

      - name: Concurrency and deadline tests
        run: bun run test:concurrency

      - name: Queue and outbox tests
        run: bun run test:queue

      - name: End-to-end critical workflows
        run: bun run test:e2e

      - name: Security regression tests
        run: bun run test:security

      # The specification is generated from the DTOs, so a drift here means an
      # API contract changed without the documentation following it.
      - name: OpenAPI contract check
        run: |
          bun run openapi:generate
          git diff --exit-code -- docs/openapi.json \
            || (echo "::error::docs/openapi.json is stale. Run 'bun run openapi:generate' and commit the result." && exit 1)

      # Both processes must reach a serving state with real dependencies.
      - name: Smoke start the API process
        run: |
          bun run src/index.ts &
          API_PID=$!
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health/ready > /dev/null; then
              echo "API reported ready"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::API never became ready"
              kill "$API_PID" 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done
          # Graceful shutdown must succeed within the configured budget.
          kill -TERM "$API_PID"
          wait "$API_PID" || true

      - name: Smoke start the worker process
        env:
          PROCESS_ROLE: worker
        run: |
          bun run src/worker.ts &
          WORKER_PID=$!
          sleep 8
          if ! kill -0 "$WORKER_PID" 2>/dev/null; then
            echo "::error::Worker process exited unexpectedly"
            exit 1
          fi
          kill -TERM "$WORKER_PID"
          wait "$WORKER_PID" || true

  security-scan:
    name: Dependency and secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Full history so the secret scan can inspect every commit, not just
          # the tip.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Dependency vulnerability scan
        run: bun audit --audit-level=high

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: backend
          format: cyclonedx-json
          output-file: backend-sbom.cdx.json
          artifact-name: backend-sbom

      - name: Secret scan
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert no real secrets in the environment template
        run: |
          if grep -nEi '^[A-Z_]+=(re_|sk_|whsec_|AKIA|ghp_|gho_)' .env.example; then
            echo "::error::.env.example appears to contain a real credential"
            exit 1
          fi
          echo ".env.example contains no credential-shaped values"

  docker:
    name: Container image build (validation only, no push)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Both targets are built: the image build also runs typecheck and lint,
      # so a broken artefact cannot be pushed.
      - name: Build API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          target: api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build worker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          target: worker
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build release image for vulnerability scan
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          target: api
          push: false
          load: true
          tags: innovation-platform-backend:ci
          cache-from: type=gha

      - name: Scan release image (no HIGH/CRITICAL findings)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: innovation-platform-backend:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'

      # Build and scan the worker target too — a vulnerability in the worker
      # image that only exists there (e.g. a worker-only dependency) would not
      # be caught if we only scan the api target above.
      - name: Build worker image for vulnerability scan
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          target: worker
          push: false
          load: true
          tags: innovation-platform-backend:ci-worker
          cache-from: type=gha

      - name: Scan worker release image (no HIGH/CRITICAL findings)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: innovation-platform-backend:ci-worker
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'

  publish:
    name: Build, push and scan images on Docker Hub
    runs-on: ubuntu-latest
    needs: [static-analysis, test, security-scan, docker]
    # Only main gets published. A PR build proves the image builds and scans
    # clean (the `docker` job above); it never earns a registry tag.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    permissions:
      contents: read
      # packages: write is NOT needed here — images go to Docker Hub, not
      # GHCR. If you ever move to GHCR, add `packages: write` to this job.
    outputs:
      api_image: ${{ steps.image-repo.outputs.api }}
      worker_image: ${{ steps.image-repo.outputs.worker }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Requires two repo secrets: DOCKERHUB_USERNAME (your Docker Hub
      # username or org) and DOCKERHUB_TOKEN (a Docker Hub access token
      # scoped to Read & Write for this repo — never your account password;
      # generate one under Account Settings > Security > Access Tokens).
      - name: Log in to Docker Hub
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Docker Hub requires a lowercase namespace/repository. Both process
      # tags (api-*, worker-*) live under ONE repository, which matters on
      # Docker Hub specifically: free accounts get exactly one private repo,
      # and tags are free — so "same image, different tag prefix" isn't just
      # tidy, it's what keeps this deployable on a free plan at all.
      - name: Compute image repository (lowercase)
        id: image-repo
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          NAMESPACE="$(echo "$DOCKERHUB_USERNAME" | tr '[:upper:]' '[:lower:]')"
          REPO="docker.io/${NAMESPACE}/innovation-platform-backend"
          echo "api=${REPO}:api-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "worker=${REPO}:worker-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "base=${REPO}" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          target: api
          push: true
          provenance: true
          sbom: true
          build-args: |
            BUILD_VERSION=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.image-repo.outputs.api }}
            ${{ steps.image-repo.outputs.base }}:api-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push worker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          target: worker
          push: true
          provenance: true
          sbom: true
          build-args: |
            BUILD_VERSION=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.image-repo.outputs.worker }}
            ${{ steps.image-repo.outputs.base }}:worker-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Re-scan the image that was actually pushed, not the locally-built one
      # from the earlier `docker` job. The two should be byte-identical given
      # a frozen lockfile and shared build cache, but "should be" isn't the
      # same guarantee as "the thing we scanned is the thing we're shipping".
      - name: Scan pushed API image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ steps.image-repo.outputs.api }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'

      - name: Scan pushed worker image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ steps.image-repo.outputs.worker }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'

  deploy:
    name: Deploy to production VPS
    runs-on: ubuntu-latest
    needs: [publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
    timeout-minutes: 15
    # A second deploy must never race a first: serialize deploys and let each
    # one finish, rather than cancelling a rollout halfway through the way the
    # top-level `ci` concurrency group cancels stale builds.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # Requires three repo secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY (and
      # optionally VPS_SSH_PORT). The VPS user must already have a working
      # kubeconfig for the k3s cluster and a `dockerhub-pull-secret` must
      # already exist in the innovation-platform namespace — see the top of
      # k8s-deploy.yaml for the one-time setup commands.
      #
      # Migrations are NOT orchestrated from here. Both Deployments carry an
      # `init-db-migrate` initContainer that runs `prisma migrate deploy`
      # before their main container starts (see k8s-deploy.yaml). Prisma's
      # migrate deploy takes an advisory lock, so it's safe for the api and
      # worker pods to both attempt it on every rollout — one applies
      # anything pending, the others find nothing to do and exit immediately.
      # `kubectl rollout status` already blocks until pods are Ready, and a
      # pod isn't Ready until its initContainers succeed — so this gives you
      # the same "don't serve traffic until the schema is current" guarantee
      # the old Job-based step did, with less moving CI machinery.
      - name: Roll out new images
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1
        env:
          API_IMAGE: ${{ needs.publish.outputs.api_image }}
          WORKER_IMAGE: ${{ needs.publish.outputs.worker_image }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          envs: API_IMAGE,WORKER_IMAGE
          script: |
            set -euo pipefail
            NS=innovation-platform

            # Update both the main container AND its init-db-migrate
            # initContainer in one call — `kubectl set image` accepts either
            # kind of container by name, and both must move to the new image
            # or the initContainer would migrate with old Prisma schema code
            # while the main container runs new application code.
            kubectl -n "$NS" set image deployment/api-deployment \
              api="${API_IMAGE}" init-db-migrate="${API_IMAGE}"
            kubectl -n "$NS" set image deployment/worker-deployment \
              worker="${WORKER_IMAGE}" init-db-migrate="${WORKER_IMAGE}"

            kubectl -n "$NS" rollout status deployment/api-deployment --timeout=180s
            kubectl -n "$NS" rollout status deployment/worker-deployment --timeout=180s